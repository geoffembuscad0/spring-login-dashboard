# TEST profile: mvn spring-boot:run -Dspring-boot.run.profiles=test
# Uses a throwaway DB so you never touch your real MySQL while testing
spring.datasource.url=jdbc:mysql://localhost:3306/login_dashboard_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.jpa.hibernate.ddl-auto=validate
# Flyway ON for test, OFF/validate for prod (see README)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.jwt.secret=test-secret-change-me-in-prod-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789
app.jwt.expiration-ms=3600000

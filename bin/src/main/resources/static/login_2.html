<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Login</title><link rel='stylesheet' href='/css/app.css'></head><body class='auth-body'><main class='auth-card'><h1>Welcome back</h1><p>Sign in to continue</p><form id='f'><label>Username<input id='u' required></label><label>Password<input id='p' type='password' required></label><p id='err' class='err'></p><button>Login →</button></form><p class='hint'>Demo: register first via API, or create a user in MySQL with a BCrypt hash.</p></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});const d=await r.json();if(!r.ok){err.textContent=d.message||'Login failed';return;}localStorage.setItem('token',d.token);localStorage.setItem('user',JSON.stringify(d));location.href='/dashboard.html';}</script></body></html>

spring.application.name=login-dashboard
server.port=8080
# --- CHANGE THESE to your existing DB ---
spring.datasource.url=jdbc:mysql://localhost:3306/your_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# JWT - use a long random secret in prod, keep in env: JWT_SECRET
app.jwt.secret=${JWT_SECRET:ChangeMeToAtLeast64CharsLongRandomSecretChangeMeToAtLeast64CharsLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# CORS for external apps / SPA
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
